---
- name: PLAY1...Capture the list of target servers
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ec2_region: "{{ your_region | default('us-west-1') }}"

  tasks:
    - name: Retrieve the VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ ec2_region }}"
        filters:
          state: available
          "tag:Name": "sc5demo-vpc"
      register: vpc_info

    - name: Retrieve info for the EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ ec2_region }}"
        filters:
          instance-state-name: running
          "tag:Name": "{{ HOSTS }}"
      register: ec2_instance_info

- name: PLAY2...ADD or REMOVE the message of the day file
  hosts: "{{ HOSTS }}"
  gather_facts: false
  become: true
  vars:
    add_remove: "{{ add_remove_survey }}"

  tasks:

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Block to ADD and enable  firewalld
    block: 
      - name: Add the FIREWALLD service package
        ansible.builtin.dnf:
          name: firewalld
          state: "{{ add_remove }}"

      - name: Enable the FIREWALLD service
        ansible.builtin.service:
          name: firewalld
          enabled: true
          state: started
      
    when: "'firewalld.service' not in ansible_facts.services"
