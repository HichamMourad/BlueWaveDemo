---
- name: PLAY1...Capture the list of target servers
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ec2_region: "{{ your_region | default('us-west-1') }}"

  tasks:
    - name: Retrieve the VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ ec2_region }}"
        filters:
          state: available
          "tag:Name": "sc5demo-vpc"
      register: vpc_info

    - name: Retrieve info for the EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ ec2_region }}"
        filters:
          instance-state-name: running
          "tag:Name": "{{ HOSTS }}"
      register: ec2_instance_info

- name: PLAY2...Check for FIREWALLD compliance on target servers
  hosts: "{{ HOSTS }}"
  gather_facts: false
  become: true
  vars: 
    service_name: firewalld

  tasks:
    - name: Check Service
      ansible.builtin.service_facts:

    - name: Check if FIREWALLD Service is enabled and running
      ansible.builtin.debug:
        msg: "COMPLIANCE STATUS: Compliant. FIREWALLD Service is enabled and running" 
      when: ansible_facts.services is defined and ansible_facts[services][firewalld.service][state] == "running"
 
    - name: Check if FIREWALLD Service is NOT enabled or NOT running
      ansible.builtin.debug:
        msg: "COMPLIANCE STATUS: OUT OF COMPLIANCE. Severity: HIGH. FIREWALLD Service is NOT enabled and NOT running"
      when: ansible_facts.services.firewalld.service is undefined or ansible_facts.services.firewalld.state != "running"
