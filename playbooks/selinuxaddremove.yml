---
- name: PLAY1...Capture the list of target servers
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ec2_region: "{{ your_region | default('us-west-1') }}"

  tasks:
    - name: Retrieve the VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ ec2_region }}"
        filters:
          state: available
          "tag:Name": "sc5demo-vpc"
      register: vpc_info

    - name: Retrieve info for the EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ ec2_region }}"
        filters:
          instance-state-name: running
          "tag:Name": "{{ HOSTS }}"
      register: ec2_instance_info

- name: PLAY2...Turn ON / OFF the SELinux Policy
  hosts: "{{ HOSTS }}"
  gather_facts: false
  become: true
  vars:
    add_remove: "{{ add_remove_survey }}"

  tasks:

    - name: Check if selinux is enabled
      ansible.builtin.command: getenforce
      register: selinux_status

    - name: Disable SELinux
      ansible.posix.selinux:
        state: disabled
      when: selinux_status.stdout != "Disabled" and add_remove == "disable"

    - name: Enable SELinux
      ansible.posix.selinux:
        policy: targeted
        state: enabled
      when: selinux_status.stdout != "Enabled" and add_remove == "enable"

    - name: Report compliance
      ansible.builtin.debug:
        msg: "COMPLIANCE STATUS: Compliant. The server is in compliance with the SELinux policy."
      when: selinux_status.stdout == "enforcing"

    - name: Report non-compliance
      ansible.builtin.debug:
        msg: "COMPLIANCE STATUS: OUT OF COMPLIANCE. Severity: HIGH. The server is out of compliance with the SELinux policy."
      when: selinux_status.stdout == "disabled" or selinux_status.stdout == "permissive"
