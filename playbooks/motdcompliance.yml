---
- name: PLAY1...Capture the list of target servers
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ec2_region: "{{ your_region | default('us-west-1') }}"
    owner_name: "{{ owner_survey }}"
    add_remove: "{{ add_remove_survey }}"

  tasks:
    - name: Retrieve the VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ ec2_region }}"
        filters:
          state: available
          "tag:Name": "sc5demo-vpc"
      register: vpc_info

    - name: Retrieve info for the EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ ec2_region }}"
        filters:
          instance-state-name: running
          "tag:Name": "{{ HOSTS }}"
      register: ec2_instance_info

- name: PLAY2...Check for The message of the day (/etc/motd) on target servers
  hosts: "{{ HOSTS }}"
  gather_facts: false
  become: true
  # vars:
  #   owner_name: "{{ motd_survey }}"
  #   add_remove: "{{ add_remove_survey }}"
  tasks:
    - name: Check if /etc/motd file exists
      ansible.builtin.stat:
        path: /etc/motd
      register: motd_file

    - name: Ensure /etc/motd exists
      ansible.builtin.debug:
        msg: "COMPLIANCE STATUS: OUT OF COMPLIANCE. Severity: LOW. /etc/motd does not exist."
      when: not motd_file.stat.exists

    - name: Check if /etc/motd file contains data
      ansible.builtin.debug:
        msg: "COMPLIANCE STATUS: OUT OF COMPLIANCE. Severity: LOW. /etc/motd exists but is empty."
      when: motd_file.stat.exists and motd_file.stat.size == 0

    - name: Output success message if /etc/motd exists and contains data
      ansible.builtin.debug:
        msg: "COMPLIANCE STATUS: Compliant. /etc/motd file exists and contains data."
      when: motd_file.stat.exists and motd_file.stat.size > 0
