---
- name: PLAY1...Capture the list of target servers
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ec2_region: "{{ your_region | default('us-west-1') }}"

  tasks:
    - name: Retrieve the VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ ec2_region }}"
        filters:
          state: available
          "tag:Name": "sc5demo-vpc"
      register: vpc_info

    - name: Retrieve info for the EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ ec2_region }}"
        filters:
          instance-state-name: running
          "tag:Name": "{{ HOSTS }}"
      register: ec2_instance_info

- name: PLAY2...Check the compliance status of RHEL/Linux servers with the SELinux Policy
  hosts: "{{ HOSTS }}"
  gather_facts: false
  become: true

  tasks:

    - name: Check if selinux is enabled
      ansible.builtin.command: getenforce
      register: selinux_status

    - name: Report compliance
      ansible.builtin.debug:
        msg: "COMPLIANCE STATUS: Compliant. The server is in compliance with the SELinux policy."
      when: selinux_status.stdout == "Enforcing"

    - name: Report non-compliance
      ansible.builtin.debug:
        msg: "COMPLIANCE STATUS: OUT OF COMPLIANCE. Severity: HIGH. The server is out of compliance with the SELinux policy."
      when: selinux_status.stdout == "Disabled"
